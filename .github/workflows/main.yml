name: Build Windows Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12.13'

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --python $env:PYTHON_VERSION --locked --group dev

      - name: Run unit tests
        run: uv run --python $env:PYTHON_VERSION --locked --group dev pytest -q --tb=short

      - name: Verify lockfile
        run: uv lock --check

  docker:
    name: Smoke authenticated WebUI container
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CPU WebUI image
        run: docker build --build-arg USE_CUDA=false -t pyvideotrans-webui:candidate .

      - name: Verify network access and authentication
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm pyvideotrans-webui:candidate > noauth.log 2>&1; then
            echo 'Container accepted a network bind without credentials'
            exit 1
          fi
          grep -q 'requires PYVIDEOTRANS_WEBUI_USER and PYVIDEOTRANS_WEBUI_PASSWORD' noauth.log

          docker run -d --rm --name pyvideotrans-ci -p 127.0.0.1:17860:7860 \
            -e PYVIDEOTRANS_WEBUI_USER=audit \
            -e PYVIDEOTRANS_WEBUI_PASSWORD=audit-pass-for-ci \
            pyvideotrans-webui:candidate
          trap 'docker rm -f pyvideotrans-ci >/dev/null 2>&1 || true' EXIT
          code=''
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:17860/config || true)
            if [ "$code" = '401' ]; then break; fi
            sleep 2
          done
          test "$code" = '401'
          curl -sS -c cookies.txt -d 'username=audit' -d 'password=audit-pass-for-ci' \
            http://127.0.0.1:17860/login > /dev/null
          valid=$(curl -sS -b cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:17860/config)
          test "$valid" = '200'
          curl -sS -c wrong-cookies.txt -d 'username=audit' -d 'password=wrong' \
            http://127.0.0.1:17860/login > /dev/null
          invalid=$(curl -sS -b wrong-cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:17860/config)
          test "$invalid" = '401'
          docker exec pyvideotrans-ci sh -c 'test ! -e /app/.env && test ! -e /app/webui.env'

  build:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: [test, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --python $env:PYTHON_VERSION --locked

      - name: Download verified FFmpeg build
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-03-18-14/ffmpeg-N-127142-g12b7b9891b-win64-gpl.zip"
          $expectedHash = "a885f564dee2b60f69ab866c6c89b96ae531fc2ee1f24ff8b5b1a6d29960a96b"
          $out = "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          $actualHash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "FFmpeg archive checksum mismatch: $actualHash" }
          Expand-Archive -Path $out -DestinationPath ffmpeg_full
          $ffmpegDir = Get-ChildItem -Directory ffmpeg_full | Select-Object -First 1
          if (-not (Test-Path "$ffmpegDir\bin\ffmpeg.exe") -or -not (Test-Path "$ffmpegDir\bin\ffprobe.exe")) { throw 'FFmpeg binaries missing' }
          Copy-Item "$ffmpegDir\bin\*" ffmpeg\ -Recurse -Force

      - name: Build with PyInstaller (using tracked spec)
        run: uv run --python $env:PYTHON_VERSION --locked pyinstaller sp.spec --clean --noconfirm

      - name: Stage application resources beside executable
        run: |
          $root = 'dist/sp'
          $resources = @('styles', 'language', 'voicejson', 'prompts', 'ui/dark')
          foreach ($relative in $resources) {
            $source = Join-Path "$root/_internal/videotrans" $relative
            if (-not (Test-Path $source)) { throw "Missing packaged resource: $relative" }
            $destination = Join-Path "$root/videotrans" $relative
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force
          }
          $ffmpegSource = "$root/_internal/ffmpeg"
          if (-not (Test-Path "$ffmpegSource/ffmpeg.exe") -or -not (Test-Path "$ffmpegSource/ffprobe.exe")) { throw 'FFmpeg was not bundled' }
          New-Item -ItemType Directory -Force -Path "$root/ffmpeg" | Out-Null
          Copy-Item -Path (Join-Path $ffmpegSource '*') -Destination "$root/ffmpeg" -Recurse -Force

      - name: Verify candidate layout
        run: |
          foreach ($required in @('dist/sp/sp.exe', 'dist/sp/ffmpeg/ffmpeg.exe', 'dist/sp/ffmpeg/ffprobe.exe', 'dist/sp/videotrans/styles/style.qss', 'dist/sp/videotrans/styles/icon.ico')) {
            if (-not (Test-Path $required)) { throw "Missing candidate file: $required" }
          }

      - name: Create release archive
        run: |
          $version = (Get-Content pyproject.toml | Select-String 'version = "(.*)"' | ForEach-Object { $_.Matches.Groups[1].Value })
          $zipName = "pyVideoTrans-v$version-windows-x64.zip"
          Compress-Archive -Path "dist\sp\*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Path "$zipName.sha256" -Encoding ascii
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Smoke extracted candidate and verify archive
        run: |
          $archive = $env:ZIP_NAME
          $checksumLine = (Get-Content "$archive.sha256" -Raw).Trim()
          $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Candidate archive checksum mismatch: $actualHash" }

          $extract = Join-Path $env:RUNNER_TEMP 'pyvideotrans-extracted'
          Expand-Archive -Path $archive -DestinationPath $extract
          $exe = Join-Path $extract 'sp.exe'
          if (-not (Test-Path $exe)) { throw 'Extracted candidate is missing sp.exe' }

          $smokeScript = Join-Path $env:RUNNER_TEMP 'smoke_frozen.py'
          $cliScript = Join-Path $env:RUNNER_TEMP 'cli.py'
          $report = Join-Path $env:RUNNER_TEMP 'candidate-smoke.json'
          Copy-Item 'scripts/smoke_frozen.py' $smokeScript
          Copy-Item 'cli.py' $cliScript
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'pyvideotrans-user-data'
          $env:QT_QPA_PLATFORM = 'offscreen'

          $principal = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls $extract /deny "$($principal):(OI)(CI)W" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not make extracted install read-only' }
          try {
          $smokeError = Join-Path $env:RUNNER_TEMP 'candidate-smoke-stderr.txt'

          $smoke = Start-Process -FilePath $exe -ArgumentList @($smokeScript, $report) -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru -RedirectStandardError $smokeError
          if (-not $smoke.WaitForExit(120000)) {
            Stop-Process -Id $smoke.Id -Force
            throw 'Packaged smoke timed out'
          }
          $smoke.Refresh()
          if (-not (Test-Path $report)) {
            if (Test-Path $smokeError) { Get-Content $smokeError -Tail 40 }
            throw 'Packaged smoke did not write a report'
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($smoke.ExitCode -ne 0 -or $result.status -ne 'pass') { throw "Packaged smoke failed: $(Get-Content $report -Raw)" }

          $cli = Start-Process -FilePath $exe -ArgumentList @($cliScript, '--version') -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
          if (-not $cli.WaitForExit(60000)) {
            Stop-Process -Id $cli.Id -Force
            throw 'Packaged CLI timed out'
          }
          $cli.Refresh()
          if ($cli.ExitCode -ne 0) { throw "Packaged CLI --version failed: $($cli.ExitCode)" }

          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $gui = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 15
              $gui.Refresh()
              if ($gui.HasExited) { throw "Packaged GUI exited during startup $attempt with code $($gui.ExitCode)" }
            } finally {
              if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force }
            }
          }
          } finally {
            & icacls $extract /remove:d $principal | Out-Null
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyVideoTrans-windows
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          retention-days: 30
